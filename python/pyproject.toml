[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actp"
version = "0.1.3"
description = "Agent Context Transfer Protocol - Pack projects for AI context sharing"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ACTP Contributors"}
]
keywords = ["actp", "ai", "context", "packaging", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
]
schema = [
    "jsonschema>=4.0",
]
gitignore = [
    "pathspec>=0.11",
]
all = [
    "jsonschema>=4.0",
    "pathspec>=0.11",
]

[project.scripts]
actp = "actp.cli.main:main"

[project.urls]
Homepage = "https://github.com/actp/actp"
Repository = "https://github.com/actp/actp"

[tool.setuptools.packages.find]
where = ["."]
include = ["actp*"]